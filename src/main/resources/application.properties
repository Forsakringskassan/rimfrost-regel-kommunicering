quarkus.index-dependency.rimfrost-adapter-folkbokford.group-id=se.fk.rimfrost.adapter.folkbokford
quarkus.index-dependency.rimfrost-adapter-folkbokford.artifact-id=rimfrost-adapter-folkbokford
quarkus.index-dependency.rimfrost-framework-regel-kommunicering.group-id=se.fk.rimfrost.framework.regel.kommunicering
quarkus.index-dependency.rimfrost-framework-regel-kommunicering.artifact-id=rimfrost-framework-regel-kommunicering
quarkus.index-dependency.rimfrost-framework-regel.group-id=se.fk.rimfrost.framework.regel
quarkus.index-dependency.rimfrost-framework-regel.artifact-id=rimfrost-framework-regel
quarkus.index-dependency.rimfrost-referensdata-erbjudande.group-id=se.fk.rimfrost.referensdata
quarkus.index-dependency.rimfrost-referensdata-erbjudande.artifact-id=rimfrost-referensdata-erbjudande
quarkus.index-dependency.rimfrost-regel-kommunicering-openapi-jaxrs-spec.group-id=se.fk.rimfrost.regel.kommunicering
quarkus.index-dependency.rimfrost-regel-kommunicering-openapi-jaxrs-spec.artifact-id=rimfrost-regel-kommunicering-openapi-jaxrs-spec

# Container image configuration
quarkus.container-image.name=rimfrost-regel-kommunicering

# Kafka setup
kafka.source=RegelKommunicering
kafka.subtopic=kommunicering
kafka.cancelled.topic=kommunicering-cancelled

#Incoming
mp.messaging.incoming.regel-requests.topic=kommunicering-requests
mp.messaging.incoming.operativt-uppgiftslager-status-notification.topic=operativt-uppgiftslager-status-notification.kommunicering

#Outgoing
mp.messaging.outgoing.regel-responses.topic=kommunicering-responses

# Persistence
quarkus.flyway.default-schema=regel_kommunicering
regel.persistence.table-prefix=kommunicering

%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}

# REST setup
folkbokford.api.base-url=http://rimfrost-k8s-folkbokford:8080
referensdata.api.base-url=http://rimfrost-k8s-referensdata:8080